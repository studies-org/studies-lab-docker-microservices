# Painel estático + proxy /api/<serviço>/ para os microserviços.
# O resolver do Docker é consultado a cada requisição: o nginx sobe mesmo se um serviço cair.
resolver 127.0.0.11 valid=10s ipv6=off;

map $api_servico $api_porta {
    items      8383;
    lojas      8282;
    pagamentos 8181;
    pedidos    8080;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/api/(?<api_servico>items|lojas|pagamentos|pedidos)/(?<api_caminho>.*)$ {
        proxy_pass http://$api_servico-service:$api_porta/$api_caminho$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
